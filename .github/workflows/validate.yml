name: Validar Coffee House
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: python -m harness.runner --mode review --browser
      - name: Validar API pública de curtidas (somente leitura)
        run: python scripts/verify_likes_api.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-review
          path: _reports/harness-report.json
          if-no-files-found: warn
